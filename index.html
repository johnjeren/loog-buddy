<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Loog Buddy</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Loog Buddy">
<meta name="theme-color" content="#FFF8EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<style>
  :root{
    --paper:#FFF8EC; --ink:#33302E; --soft:#8A8377;
    --em:#3EC98B; --c:#FFB528; --g:#4FA8F6; --coral:#FF6B5E;
    --card:#FFFFFF;
    --shadow:0 6px 0 rgba(51,48,46,.12), 0 14px 24px -14px rgba(51,48,46,.2);
    --edge:3px solid var(--ink);
    --pop:cubic-bezier(.34,1.56,.64,1);
    --display:"ui-rounded","SF Pro Rounded","Arial Rounded MT Bold","Hiragino Maru Gothic ProN",-apple-system,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;}
  html,body{height:100%;}
  body{margin:0; color:var(--ink); font-family:-apple-system,system-ui,sans-serif;
    background:var(--paper) radial-gradient(rgba(51,48,46,.045) 1.5px, transparent 1.5px);
    background-size:26px 26px; transition:background-color .35s;
    display:flex; flex-direction:column; overflow:hidden; touch-action:manipulation;}
  /* every tab is its own room in the playhouse */
  body[data-screen="chords"]{--paper:#FFF1CE;}
  body[data-screen="songs"]{--paper:#E4F6EB;}
  body[data-screen="switch"]{--paper:#E4F0FD;}
  body[data-screen="jam"]{--paper:#FFE9E2;}
  body[data-screen="stickers"]{--paper:#F3EDFF;}
  body[data-screen="tuner"]{--paper:#E4F0FD;}
  body[data-screen="strum"]{--paper:#FDE9F2;}
  header{padding:calc(10px + env(safe-area-inset-top)) 20px 0 20px; display:flex; align-items:center; gap:10px;}
  header h1{font-family:var(--display); font-size:1.6rem; margin:0; letter-spacing:.5px; transform:rotate(-1.2deg);}
  #header-band{margin-left:auto; align-self:flex-end; height:40px; overflow:hidden; display:flex; align-items:flex-start;}
  #header-band svg{width:36px; height:54px; margin-left:-9px;}
  #header-band svg:nth-child(odd){transform:translateY(6px) rotate(-6deg);}
  #header-band svg:nth-child(even){transform:translateY(2px) rotate(5deg);}
  header .dot{width:14px;height:14px;border-radius:50%; box-shadow:0 2px 0 rgba(51,48,46,.15);
    animation:dotIn .5s var(--pop) backwards;}
  header .dot:nth-child(2){animation-delay:.07s;}
  header .dot:nth-child(3){animation-delay:.14s;}
  @keyframes dotIn{from{transform:scale(0);}}
  main{flex:1; overflow:hidden; position:relative;}
  .screen{position:absolute; inset:0; display:none; flex-direction:column;
    padding:8px calc(16px + env(safe-area-inset-right)) 16px calc(16px + env(safe-area-inset-left));}
  .screen.active{display:flex; animation:screenIn .3s var(--pop);}
  @keyframes screenIn{from{opacity:0; transform:translateY(12px) scale(.985);}}

  /* ---------- tabs ---------- */
  nav{display:flex; gap:10px; padding:12px 14px calc(14px + env(safe-area-inset-bottom)); background:#fff;
    border-top:3px solid var(--ink);}
  nav button{flex:1; font-family:var(--display); font-size:.95rem; padding:8px 4px 10px; border:var(--edge); border-radius:22px;
    background:#fff; color:var(--ink); cursor:pointer; transition:transform .12s var(--pop); white-space:nowrap;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    box-shadow:0 4px 0 rgba(51,48,46,.15);}
  nav button .ico{font-size:1.7rem; line-height:1;}
  nav button:active{transform:scale(.94) translateY(2px);}
  nav button.on{background:var(--tc,var(--ink)); color:#fff; transform:scale(1.07) translateY(-4px);
    box-shadow:0 7px 0 rgba(51,48,46,.22); animation:navPop .3s var(--pop);}
  @keyframes navPop{50%{transform:translateY(-7px) scale(1.12);}}
  nav button:focus-visible{outline:3px solid var(--g); outline-offset:2px;}

  /* ---------- chords screen ---------- */
  .chord-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:12px;}
  .chord-card{border:var(--edge); border-radius:24px; background:var(--card); box-shadow:var(--shadow);
    border-bottom:6px solid var(--cc, rgba(51,48,46,.12));
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer;
    padding:16px 8px; transition:transform .12s var(--pop);}
  .chord-card:nth-child(odd){transform:rotate(-.8deg);}
  .chord-card:nth-child(even){transform:rotate(.7deg);}
  .chord-card:active{transform:scale(.95,.92) translateY(3px);}
  .chord-card .big{font-family:var(--display); font-size:clamp(2.6rem,9vw,4.5rem); line-height:1;}
  .chord-card .hint{font-family:var(--display); font-size:.85rem; color:#fff; padding:5px 12px; border-radius:999px; white-space:nowrap;}
  .chord-card.playing{animation:wiggle .4s;}
  @keyframes wiggle{25%{transform:rotate(-2deg) scale(1.03);}75%{transform:rotate(2deg) scale(1.03);}}

  .diagram-wrap{flex:1; min-height:0; margin-top:14px; background:var(--card); border-radius:28px;
    border:var(--edge); box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; gap:20px; padding:12px;}
  .diagram-wrap svg{height:100%; max-width:52%;}
  .diagram-side{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .diagram-side .name{font-family:var(--display); font-size:2.6rem;}
  .strum-btn{font-family:var(--display); font-size:1.5rem; color:#fff; background:var(--coral); border:var(--edge);
    border-radius:999px; padding:16px 34px; cursor:pointer; box-shadow:0 5px 0 #d94f44;}
  .strum-btn:active{transform:translateY(3px); box-shadow:0 2px 0 #d94f44;}

  /* ---------- songs screen ---------- */
  .song-list{flex:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px;
    align-content:start; overflow-y:auto; padding-bottom:8px;}
  .song-btn{border:var(--edge); border-radius:24px; background:var(--card); box-shadow:var(--shadow); padding:16px 20px;
    display:flex; align-items:center; gap:16px; cursor:pointer; text-align:left; transition:transform .12s var(--pop);}
  .song-btn:nth-child(odd){transform:rotate(-.35deg);}
  .song-btn:nth-child(even){transform:rotate(.3deg);}
  .song-btn:active{transform:scale(.97) translateY(2px);}
  .song-btn .emoji{font-size:1.8rem; width:56px; height:56px; flex:0 0 56px; display:flex; align-items:center;
    justify-content:center; background:var(--paper); border-radius:18px;}
  .song-btn .t{font-family:var(--display); font-size:1.3rem; line-height:1.15;}
  .song-btn .s{color:var(--soft); font-size:.95rem; margin-top:2px;}

  /* ---------- play-along ---------- */
  #play{align-items:center; justify-content:center; gap:8px;}
  #play .lyric{font-family:var(--display); font-size:clamp(1.4rem,4.5vw,2.2rem); min-height:2.6rem; text-align:center; text-wrap:balance;}
  #bubble{width:min(46vw,300px); height:min(46vw,300px); border-radius:50%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; color:#fff; transition:background .2s; cursor:pointer;
    border:4px solid var(--ink);
    box-shadow:0 8px 0 rgba(51,48,46,.14), 0 20px 32px -18px rgba(51,48,46,.3),
      inset 0 12px 0 rgba(255,255,255,.16), inset 0 -10px 0 rgba(0,0,0,.08);
    animation:breathe 3s ease-in-out infinite;}
  @keyframes breathe{50%{transform:scale(1.02);}}
  #bubble .letter{font-family:var(--display); font-size:clamp(4rem,18vw,8rem); line-height:1;}
  #bubble .strum{font-family:var(--display); font-size:1.3rem; opacity:0; letter-spacing:2px;}
  #bubble.beat{animation:bounce .28s;}
  #bubble.beat .strum{opacity:1;}
  @keyframes bounce{40%{transform:scale(1.12);}}
  #next-chord{font-family:var(--display); font-size:1.15rem; color:var(--soft); min-height:1.5rem;
    display:flex; align-items:center; gap:8px;}
  #next-diagram{height:64px; opacity:.75;}
  #play-diagram{height:min(30vh,210px); background:var(--card); border-radius:20px;
    box-shadow:var(--shadow); padding:6px;}
  @media (max-width:420px){ #play-diagram{height:min(24vh,170px);} #buddy svg{width:56px;} }
  #count{font-family:var(--display); font-size:5rem; min-height:0;}
  .play-ctl{display:flex; gap:12px; margin-top:6px;}
  .play-ctl button{font-family:var(--display); font-size:1.2rem; border:none; border-radius:999px; padding:14px 28px; cursor:pointer;}
  #stop-btn{background:var(--paper); color:var(--ink); border:3px solid rgba(51,48,46,.15);}
  #cheer{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:var(--paper); z-index:5; gap:10px; overflow:hidden;}
  #cheer.show{display:flex;}
  #cheer::before{content:''; position:absolute; left:50%; top:50%; width:200vmax; height:200vmax;
    margin:-100vmax 0 0 -100vmax;
    background:repeating-conic-gradient(rgba(255,181,40,.1) 0 9deg, transparent 9deg 18deg);
    animation:sunspin 26s linear infinite;}
  @keyframes sunspin{to{transform:rotate(360deg);}}
  #cheer>*{position:relative;}
  #cheer .stars{font-size:4.5rem; animation:pop .5s;}
  #cheer h2{font-family:var(--display); font-size:2.4rem; margin:0;}
  @keyframes pop{0%{transform:scale(.3);}70%{transform:scale(1.2);}}
  /* ---------- chord match feedback ---------- */
  #mic-toggle-chords{font-family:var(--display); font-size:1.05rem;}
  #mic-toggle-chords.on{color:#fff;}
  #chord-heard{font-family:var(--display); font-size:1.3rem; min-height:3.2rem; text-align:center; text-wrap:balance;}
  #chord-heard.hit{color:var(--em); animation:pop .4s;}
  #chord-heard.other{color:var(--soft);}

  /* ---------- jam ---------- */
  #jam-grid{flex:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px;}
  .jam-pad{border:var(--edge); border-radius:28px; color:#fff; cursor:pointer; font-family:var(--display);
    font-size:clamp(3rem,10vw,5.5rem); transition:transform .06s;
    box-shadow:0 7px 0 rgba(51,48,46,.22), 0 18px 28px -16px rgba(51,48,46,.35),
      inset 0 8px 0 rgba(255,255,255,.22), inset 0 -8px 0 rgba(0,0,0,.1);
    text-shadow:0 3px 0 rgba(0,0,0,.15);}
  .jam-pad:active{transform:scale(.93,.9) translateY(5px);
    box-shadow:0 2px 0 rgba(51,48,46,.22), inset 0 8px 0 rgba(255,255,255,.22), inset 0 -8px 0 rgba(0,0,0,.1);}
  .jam-pad.hit{animation:wiggle .35s;}

  /* ---------- toolbar: stars, tempo, mic ---------- */
  .songbar{display:flex; align-items:center; gap:10px; padding:4px 2px 12px; flex-wrap:wrap;}
  #star-total{font-family:var(--display); font-size:1.3rem; background:var(--card); border:var(--edge);
    border-radius:999px; padding:8px 16px; box-shadow:var(--shadow); transition:transform .1s var(--pop);}
  #star-total:active{transform:scale(.95) translateY(2px);}
  .toggle-group{display:flex; gap:6px; margin-left:auto;}
  .toggle{font-size:1.4rem; border:var(--edge); background:var(--card); border-radius:16px;
    padding:8px 14px; cursor:pointer; box-shadow:0 3px 0 rgba(51,48,46,.1); transition:transform .1s var(--pop);}
  .toggle:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(51,48,46,.1);}
  .toggle.on{border-color:var(--ink); background:var(--ink);}
  .song-btn{position:relative;}
  .song-btn > span:nth-child(2){flex:1; min-width:0; padding-right:52px;}
  .song-btn .badge{position:absolute; top:10px; right:14px; font-size:1.1rem; display:flex; flex-direction:column;
    align-items:flex-end; gap:4px; white-space:nowrap; transform:rotate(4deg);}

  /* ---------- buddy + stage ---------- */
  #stage{display:flex; align-items:center; justify-content:center; gap:4vw;}
  #buddy svg{width:clamp(80px,19vw,140px); height:auto; display:block;}
  #buddy.dance{animation:hop .3s;}
  @keyframes hop{40%{transform:translateY(-18px) rotate(-8deg) scale(1.1);}}

  /* ---------- confetti + cheer extras ---------- */
  .confetti{position:absolute; top:-8%; z-index:6; font-size:1.9rem; animation:fall 1.6s ease-in forwards; pointer-events:none;}
  @keyframes fall{to{transform:translateY(115vh) rotate(340deg); opacity:.7;}}
  #mic-report{font-family:var(--display); font-size:1.4rem; color:var(--coral); min-height:1.5rem;}

  /* ---------- guide characters ---------- */
  #guide{display:flex; align-items:center; gap:10px; cursor:pointer;
    padding:4px calc(16px + env(safe-area-inset-right)) 6px calc(16px + env(safe-area-inset-left));}
  #guide.hide{display:none;}
  #guide .face{flex:0 0 auto; line-height:0;}
  #guide .face svg{width:48px; height:72px; display:block;}
  #guide.talk .face{animation:hop .4s;}
  #guide .say{position:relative; background:var(--card); border:var(--edge); border-radius:18px; box-shadow:var(--shadow);
    padding:10px 16px; font-family:var(--display); font-size:1rem; line-height:1.25; text-wrap:balance;
    transform:rotate(-.4deg);}
  #guide .say::before{content:''; position:absolute; left:-8px; top:50%; margin-top:-7px;
    border:7px solid transparent; border-right-color:var(--card);}
  #guide .say b{color:var(--cc,var(--coral));}

  /* ---------- play: word highlight + progress ---------- */
  #play .lyric .w{opacity:.35; transition:opacity .15s, transform .15s; display:inline-block;}
  #play .lyric .w.lit{opacity:1; transform:scale(1.08);}
  #progress{width:min(80%,420px); height:14px; border-radius:999px; background:rgba(51,48,46,.1); overflow:hidden;}
  #progress i{display:block; height:100%; width:0; border-radius:999px; background-color:var(--em);
    transition:background-color .2s;
    background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    background-size:110px 100%; background-repeat:no-repeat; animation:shine 1.8s linear infinite;}
  @keyframes shine{from{background-position:-110px 0;}to{background-position:calc(100% + 110px) 0;}}

  /* ---------- switch trainer ---------- */
  #switch{gap:10px; align-items:center;}
  .pair-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .pair-chip{font-family:var(--display); font-size:1.1rem; border:var(--edge); background:var(--card);
    border-radius:16px; padding:8px 14px; cursor:pointer; color:var(--soft);
    box-shadow:0 3px 0 rgba(51,48,46,.1); transition:transform .1s var(--pop);}
  .pair-chip:active{transform:translateY(2px);}
  .pair-chip.on{border-color:var(--ink); color:var(--ink); box-shadow:var(--shadow);}
  #sw-target{width:min(58vw,320px); border-radius:28px; background:var(--card); border:var(--edge); box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; gap:14px; padding:12px; cursor:pointer;
    transition:transform .1s var(--pop);}
  #sw-target:active{transform:scale(.97) translateY(2px);}
  #sw-target svg{height:min(30vh,200px);}
  #sw-target .letter{font-family:var(--display); font-size:clamp(3rem,14vw,5.5rem); line-height:1;}
  #sw-target.beat{animation:bounce .28s;}
  #sw-target.good{animation:pop .35s;}
  #sw-score{font-family:var(--display); font-size:1.5rem; min-height:2rem; text-align:center; text-wrap:balance;}
  #sw-level{font-family:var(--display); font-size:1.05rem; color:var(--soft);}
  #new-animal{font-family:var(--display); font-size:1.4rem; display:none; text-align:center;}
  #new-animal.show{display:flex; flex-direction:column; align-items:center; gap:2px; animation:pop .5s;}
  #new-animal .joins{font-size:1rem; color:var(--soft); font-style:italic;}
  #band-shelf{display:flex; gap:2px; align-items:center; flex-wrap:wrap;}

  /* ---------- unlock ladder + mastery + streak ---------- */
  .song-btn.locked{opacity:.5;}
  .song-btn.locked .emoji{filter:grayscale(1);}
  .song-btn .meta{color:var(--soft); font-size:.85rem; margin-top:2px;}
  .song-btn .concert-badge{font-size:1.5rem; padding:4px 6px; border-radius:12px; background:var(--paper);}
  #streak-pill{font-family:var(--display); font-size:1.1rem; background:var(--card); border-radius:999px;
    padding:8px 12px; box-shadow:var(--shadow);}
  #star-total{cursor:pointer;}

  /* ---------- sticker book ---------- */
  #stickers{overflow-y:auto;}
  #stickers h2{font-family:var(--display); margin:6px 0 10px;}
  .sticker-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; padding-bottom:12px;}
  .sticker{background:var(--card); border:var(--edge); border-radius:20px; box-shadow:var(--shadow);
    padding:14px 10px; text-align:center;}
  .sticker:nth-child(3n){transform:rotate(-1.2deg);}
  .sticker:nth-child(3n+1){transform:rotate(.9deg);}
  .sticker:nth-child(3n+2){transform:rotate(-.4deg);}
  .sticker .ic{font-size:2.6rem;}
  .sticker .nm{font-family:var(--display); font-size:.95rem; margin-top:4px;}
  .sticker .how{color:var(--soft); font-size:.8rem; margin-top:2px;}
  .sticker.todo{opacity:.4;}
  .sticker.todo .ic{filter:grayscale(1);}

  /* ---------- ear game ---------- */
  #ear-btn.on{background:var(--g); border-color:var(--g); color:#fff;}
  #chords.ear-on .chord-card .hint{visibility:hidden;}

  /* ---------- concert mode ---------- */
  body.concert{background:#241f33 radial-gradient(rgba(255,255,255,.06) 1.5px, transparent 1.5px); background-size:26px 26px;}
  body.concert header h1, body.concert #play .lyric, body.concert #count{color:#fff;}
  #crowd-row{display:flex; gap:2px; justify-content:center; min-height:0;}
  #crowd-row svg{width:38px; height:57px;}
  #crowd-row.rock svg{animation:hop .55s infinite;}
  #crowd-row.rock svg:nth-child(2n){animation-delay:.28s;}

  /* ---------- jam builder + recorder ---------- */
  #builder{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding-bottom:10px;}
  #builder .lbl{font-family:var(--display); font-size:1rem; color:var(--soft);}
  .slot{width:58px; height:58px; border:3px dashed var(--ink); border-radius:16px; font-family:var(--display); font-size:1.4rem;
    color:var(--ink); background:rgba(255,255,255,.5); cursor:pointer; box-shadow:var(--shadow);}
  .slot.set{border-style:solid; color:#fff;}
  #build-play{font-size:1.1rem; padding:12px 20px;}
  #rec-row{display:flex; gap:8px; align-items:center; padding:10px 0 0;}
  #rec-row .toggle{font-family:var(--display); font-size:1.05rem;}
  #rec-btn.rec{background:var(--coral); border-color:var(--coral); color:#fff; animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.55;}}
  #rec-play:disabled{opacity:.4;}

  /* ---------- tuner ---------- */
  #tuner{align-items:center; gap:14px; justify-content:center;}
  #tune-strings{display:flex; gap:10px;}
  #needle-wrap{width:min(70vw,340px); height:150px; position:relative; background:var(--card);
    border:var(--edge); border-radius:24px 24px 10px 10px; box-shadow:var(--shadow); overflow:hidden;}
  #needle-wrap::before{content:''; position:absolute; left:50%; top:8px; bottom:8px; width:3px;
    margin-left:-1.5px; background:rgba(51,48,46,.15); border-radius:2px;}
  #needle{position:absolute; left:50%; bottom:8px; width:7px; height:118px; background:var(--coral);
    border-radius:4px; transform:translateX(-50%); transform-origin:bottom center; transition:transform .15s;}
  #tune-msg{font-family:var(--display); font-size:1.4rem; min-height:2rem; text-align:center; text-wrap:balance;}
  #tuner.good #needle-wrap{outline:6px solid var(--em);}
  #tuner.good #needle{background:var(--em);}

  /* ---------- strum school ---------- */
  #strum{align-items:center; gap:14px; justify-content:center;}
  #pat-display{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .pat-slot{width:54px; height:72px; border:var(--edge); border-radius:16px; background:var(--card);
    display:flex; align-items:center; justify-content:center; font-family:var(--display); font-size:2rem;
    box-shadow:var(--shadow); transition:transform .1s var(--pop);}
  .pat-slot.dn{color:var(--em);} .pat-slot.up{color:var(--g);} .pat-slot.rest{opacity:.35;}
  .pat-slot.lit{background:var(--ink); color:#fff; transform:scale(1.12) translateY(-3px);}
  #pat-name{font-family:var(--display); font-size:1.25rem; text-align:center; text-wrap:balance;}

  /* ---------- grown-up corner: save codes ---------- */
  #grownup{margin-top:14px; padding-top:12px; border-top:3px dashed rgba(51,48,46,.12);}
  #grownup .gu-title{font-family:var(--display); color:var(--soft); margin-bottom:8px;}
  #save-code{width:100%; min-height:70px; border-radius:14px; border:3px solid rgba(51,48,46,.15);
    padding:8px; font-size:.8rem; font-family:monospace; resize:vertical;
    user-select:text; -webkit-user-select:text;}

  /* ---------- duet ---------- */
  #turn-tag{font-family:var(--display); font-size:1.2rem; min-height:1.6rem;}
  #turn-tag .you{color:var(--em);} #turn-tag .band{color:var(--g);}
  /* ---------- critters are alive: bob, breathe, sway, blink ---------- */
  .critter g{transform-box:fill-box;}
  .critter .cr-head{animation:crBob 3s ease-in-out infinite; animation-delay:var(--cd,0s); transform-origin:50% 88%;}
  .critter .cr-body{animation:crBreathe 3s ease-in-out infinite; animation-delay:var(--cd,0s); transform-origin:50% 100%;}

<script>
/* ---------- Loog chord data: strings low→high G3 B3 E4, frets ---------- */
const CHORDS = {
  Em:{frets:[0,0,0], fingers:[0,0,0], color:'#3EC98B', hint:'no fingers!'},
  C: {frets:[0,1,0], fingers:[0,1,0], color:'#FFB528', hint:'1 finger'},
  G: {frets:[0,0,3], fingers:[0,0,3], color:'#4FA8F6', hint:'1 finger'},
  Am:{frets:[2,1,0], fingers:[2,1,0], color:'#F1568C', hint:'2 fingers'},
  D: {frets:[2,3,2], fingers:[1,3,2], color:'#9B6DE0', hint:'3 fingers — super chord!'},
};
const OPEN_FREQ = [196.00, 246.94, 329.63]; // G3 B3 E4

/* ---------- audio: plucked-string synth ---------- */
let ctx;
function audio(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); return ctx; }
/* Karplus-Strong plucked string: noise burst circulating through an averaging
   delay line. Rendered once per pitch into a buffer and cached — playback is free. */
const ksCache=new Map();
function ksBuffer(freq, damp=0.996){
  const key=Math.round(freq)+':'+damp;
  if(ksCache.has(key)) return ksCache.get(key);
  const ac=audio(), sr=ac.sampleRate, N=Math.max(2,Math.round(sr/freq)), len=Math.floor(sr*1.5);
  const buf=ac.createBuffer(1,len,sr), d=buf.getChannelData(0), ring=new Float32Array(N);
  for(let i=0;i<N;i++) ring[i]=Math.random()*2-1;
  let idx=0;
  const k=damp*0.5;
  for(let i=0;i<len;i++){
    const cur=ring[idx], nxt=ring[(idx+1)%N];
    d[i]=cur; ring[idx]=k*(cur+nxt);
    idx=(idx+1)%N;
  }
  ksCache.set(key,buf); return buf;
}

/* ---------- guitar tones: same string, different amp ---------- */
const TONES=[
  {id:'acoustic', label:'🪵 Acoustic'},
  {id:'clean',    label:'🎸 Clean'},
  {id:'crunch',   label:'🤘 Heavy'},
];
let toneIdx=0;   // hydrated from LB once storage loads (LB is declared further down)
let distCurve=null;
function dist(){
  if(!distCurve){
    distCurve=new Float32Array(1024);
    for(let i=0;i<1024;i++){ const x=i/511.5-1; distCurve[i]=Math.tanh(5.5*x); }
  }
  return distCurve;
}
function pluck(freq, when, vol=0.5){
  const ac=audio(); when = when ?? ac.currentTime;
  const tone=TONES[toneIdx].id;
  const s=ac.createBufferSource(), g=ac.createGain(), f=ac.createBiquadFilter();
  f.type='lowpass';
  if(tone==='crunch'){
    s.buffer=ksBuffer(freq, 0.9985);           // electric strings ring longer
    const pre=ac.createGain(); pre.gain.value=11;
    const ws=ac.createWaveShaper(); ws.curve=dist(); ws.oversample='2x';
    s.connect(pre); pre.connect(ws); ws.connect(f);
    f.frequency.value=2600; g.gain.value=vol*0.42;
  }else if(tone==='clean'){
    s.buffer=ksBuffer(freq, 0.9985);
    s.connect(f); f.frequency.value=4500; g.gain.value=vol*0.9;
  }else{
    s.buffer=ksBuffer(freq);
    s.connect(f); f.frequency.value=Math.min(8000,freq*10); g.gain.value=vol*1.1;
  }
  f.connect(g); g.connect(ac.destination);
  s.start(when); s.stop(when+1.55);
}
function strum(name, when){
  const ac=audio(); when = when ?? ac.currentTime;
  try{ matchCooldownUntil=performance.now()+1800; }catch{}  // don't let the matcher hear the app itself
  CHORDS[name].frets.forEach((fr,i)=> pluck(OPEN_FREQ[i]*Math.pow(2,fr/12), when + i*0.06, 0.42));
}
/* up-strum: high string first, lighter — the "up" half of a strumming pattern */
function strumUp(name, when){
  const ac=audio(); when = when ?? ac.currentTime;
  try{ matchCooldownUntil=performance.now()+1800; }catch{}
  const frets=CHORDS[name].frets;
  for(let i=frets.length-1;i>=0;i--)
    pluck(OPEN_FREQ[i]*Math.pow(2,frets[i]/12), when+(frets.length-1-i)*0.035, 0.2);
}

/* ---------- backing band: drums + bass, synthesised so it works offline ---------- */
const ROOTS={Em:82.41, C:130.81, G:98.00, Am:110.00, D:146.83};   // one octave under the guitar
let songGain=null, noiseBuf=null;
function noise(){
  if(!noiseBuf){ const ac=audio(), n=Math.floor(ac.sampleRate*0.5);
    noiseBuf=ac.createBuffer(1,n,ac.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; }
  return noiseBuf;
}
function kick(when,dest){
  const ac=audio(), o=ac.createOscillator(), g=ac.createGain();
  o.frequency.setValueAtTime(140,when); o.frequency.exponentialRampToValueAtTime(45,when+0.12);
  g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(0.55,when+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,when+0.3);
  o.connect(g); g.connect(dest); o.start(when); o.stop(when+0.32);
}
function snare(when,dest){
  const ac=audio(), s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noise(); f.type='bandpass'; f.frequency.value=1900; f.Q.value=0.7;
  g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(0.2,when+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,when+0.17);
  s.connect(f); f.connect(g); g.connect(dest); s.start(when); s.stop(when+0.2);
}
function hat(when,dest,vol){
  const ac=audio(), s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noise(); f.type='highpass'; f.frequency.value=7000;
  g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(vol,when+0.003);
  g.gain.exponentialRampToValueAtTime(0.0001,when+0.05);
  s.connect(f); f.connect(g); g.connect(dest); s.start(when); s.stop(when+0.07);
}
function bass(freq,when,dur,dest){
  const ac=audio(), o=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain();
  o.type='triangle'; o.frequency.value=freq;
  f.type='lowpass'; f.frequency.value=freq*4;
  g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(0.3,when+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  o.connect(f); f.connect(g); g.connect(dest); o.start(when); o.stop(when+dur+0.05);
}
function stopBacking(){ if(songGain){ try{ songGain.disconnect(); }catch{} songGain=null; } }

/* lay the whole groove down on the audio clock — steadier than setTimeout ever gets */
function scheduleBacking(song, beatMs, leadMs){
  const ac=audio(); stopBacking();
  songGain=ac.createGain(); songGain.gain.value=0.85; songGain.connect(ac.destination);
  const dest=songGain, beatS=beatMs/1000, t0=ac.currentTime+leadMs/1000;
  for(let b=-4;b<0;b++) click(t0+b*beatS, b===-4, dest);   // tempo-locked count-in
  const line=[];
  song.events.forEach(([c,beats])=>{ for(let k=0;k<beats;k++) line.push(c); });
  line.forEach((chord,i)=>{
    const at=t0+i*beatS;
    if(i%4===0||i%4===2) kick(at,dest);
    if(i%4===1||i%4===3) snare(at,dest);
    hat(at,dest,0.07); hat(at+beatS/2,dest,0.04);
    // pitched bass biases the chord guesser, so drums only while the mic is scoring
    if(!micOn && i%2===0) bass(ROOTS[chord], at, beatS*0.9, dest);
  });
}

/* ---------- fretboard diagram ---------- */
function chordSVG(name){
  const {frets,fingers,color}=CHORDS[name];
  const L=40,R=180,T=40,B=270,rows=4,cols=3, sw=(R-L)/(cols-1), rh=(B-T)/rows;
  let s=`<rect x="${L-14}" y="${T-6}" width="${R-L+28}" height="${B-T+12}" rx="14" fill="#F6EEDD"/>`;
  s+=`<rect x="${L-10}" y="${T-8}" width="${R-L+20}" height="10" rx="4" fill="#33302E"/>`;
  for(let r=1;r<=rows;r++) s+=`<line x1="${L-10}" y1="${T+r*rh}" x2="${R+10}" y2="${T+r*rh}" stroke="#CBBFA6" stroke-width="3"/>`;
  for(let c=0;c<cols;c++)  s+=`<line x1="${L+c*sw}" y1="${T}" x2="${L+c*sw}" y2="${B}" stroke="#8A8377" stroke-width="${4-c}"/>`;
  frets.forEach((fr,i)=>{
    const x=L+i*sw;
    if(fr===0) s+=`<circle cx="${x}" cy="${T-22}" r="10" fill="none" stroke="${color}" stroke-width="4"/>`;
    else s+=`<circle cx="${x}" cy="${T+(fr-0.5)*rh}" r="16" fill="${color}"/>
             <text x="${x}" y="${T+(fr-0.5)*rh+6}" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">${fingers[i]}</text>`;
  });
  ['G','B','E'].forEach((n,i)=> s+=`<text x="${L+i*sw}" y="${B+24}" text-anchor="middle" font-size="15" fill="#8A8377" font-weight="bold">${n}</text>`);
  return s;
}
function drawChord(name){
  document.getElementById('fretboard').innerHTML=chordSVG(name);
  document.getElementById('diag-name').textContent=name;
  document.getElementById('diag-name').style.color=CHORDS[name].color;
}
let currentChord='Em';
const chordRow=document.getElementById('chord-row');
Object.entries(CHORDS).forEach(([name,ch])=>{
  const b=document.createElement('button'); b.className='chord-card'; b.style.setProperty('--cc',ch.color);
  b.innerHTML=`<span class="big" style="color:${ch.color}">${name}</span><span class="hint" style="background:${ch.color}">${ch.hint}</span>`;
  b.addEventListener('click',()=>{
    if(earOn&&earTarget){ earAnswer(name,b); return; }
    currentChord=name; drawChord(name); strum(name);
    b.classList.remove('playing'); void b.offsetWidth; b.classList.add('playing');
  });
  chordRow.appendChild(b);
});
drawChord('Em');
document.getElementById('strum-again').addEventListener('click',()=>strum(earOn&&earTarget?earTarget:currentChord));

/* ---------- mic strum listener (amplitude spikes, deliberately generous) ---------- */
const micBtn=document.getElementById('mic-toggle'), micBtnChords=document.getElementById('mic-toggle-chords');
let micOn=false, micStream=null, analyser=null, micData=null, freqData=null, micLevel=0, micBase=0.006, micLoop=0;
function micButtonsSync(){
  micBtn.classList.toggle('on',micOn);
  micBtnChords.classList.toggle('on',micOn);
  micBtnChords.style.background=micOn?'var(--coral)':'';

async function toggleMic(failBtn){
  if(micOn){ micOn=false; stopMic(); micButtonsSync(); return; }
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ac=audio(), src=ac.createMediaStreamSource(micStream);
    analyser=ac.createAnalyser(); analyser.fftSize=4096; analyser.smoothingTimeConstant=0.4; src.connect(analyser);
    micData=new Float32Array(analyser.fftSize);
    freqData=new Float32Array(analyser.frequencyBinCount);
    micOn=true; trackMic();
  }catch{ const t=failBtn.textContent; failBtn.textContent='🎤🚫'; setTimeout(()=>failBtn.textContent=t,1500); }
  micButtonsSync();
}
micBtn.addEventListener('click',()=>toggleMic(micBtn));
micBtnChords.addEventListener('click',()=>toggleMic(micBtnChords));
function trackMic(){
  if(!micOn||!analyser) return;
  analyser.getFloatTimeDomainData(micData);
  let sum=0; for(let i=0;i<micData.length;i++) sum+=micData[i]*micData[i];
  micLevel=Math.sqrt(sum/micData.length);
  micBase=micBase*0.995+micLevel*0.005;   // slow-moving room noise floor
  chordMatchTick();
  tunerTick();
  micLoop=requestAnimationFrame(trackMic);
}

/* ---------- chord match game on the Chords tab ---------- */
const heardEl=document.getElementById('chord-heard');

function chordMatchTick(){
  if(!document.getElementById('chords').classList.contains('active')) return;
  const now=performance.now();
  if(now<matchCooldownUntil) return;
  if(micLevel>Math.max(0.025, micBase*3)){
    matchCooldownUntil=now+1400;          // one guess per strum
    setTimeout(()=>{                       // let the chord ring before guessing
      if(!micOn) return;

}

/* chord guesser: which of the 5 chords does the spectrum look most like?
   Scores energy at each chord's note fundamentals + 2 harmonics. Best-effort and
   deliberately generous — used only to praise, never to say "wrong". */
function guessChord(){
  if(!analyser) return null;
  analyser.getFloatFrequencyData(freqData);
  const binHz=audio().sampleRate/analyser.fftSize;
  const energyAt=f=>{
    const b=Math.round(f/binHz); let m=-160;
    for(let i=Math.max(0,b-1);i<=b+1;i++) m=Math.max(m,freqData[i]??-160);
    return m+140; // shift so silence ~ -20dB → 0-ish floor
  };
  let best=null,bestScore=-1;
  for(const [name,ch] of Object.entries(CHORDS)){
    let s=0;
    ch.frets.forEach((fr,i)=>{
      const f=OPEN_FREQ[i]*Math.pow(2,fr/12);
      s+=energyAt(f)+0.5*energyAt(f*2)+0.25*energyAt(f*3);
    });
    if(s>bestScore){ bestScore=s; best=name; }
  }
  return best;
}

/* watch a window after a cue: did the room get loud, and did it sound like the chord? */
function listenForStrum(hitBox, expected){
  if(!micOn) return;
  const start=performance.now(), base=micLevel;
  const check=()=>{
    if(performance.now()-start>1100) return;
    if(micLevel>Math.max(0.02, base*2.2)){
      hitBox.hits++;
      setTimeout(()=>{ if(guessChord()===expected) hitBox.correct++; },120); // let the strum ring
      return;
    }
    requestAnimationFrame(check);
  };
  requestAnimationFrame(check);
}

function crowdCheer(when,dur){
  const ac=audio();
  if(!crowdGain){ crowdGain=ac.createGain(); crowdGain.connect(ac.destination); }
  const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noise(); s.loop=true;
  f.type='bandpass'; f.frequency.value=1100; f.Q.value=0.4;
  g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(0.16,when+0.4);
  g.gain.setValueAtTime(0.16,when+Math.max(0.5,dur-0.6)); g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  s.connect(f); f.connect(g); g.connect(crowdGain); s.start(when); s.stop(when+dur+0.1);
}

function runProgress(startAt, endAt){
  const t0=performance.now();
  const tick=()=>{
    const p=Math.max(0,Math.min(1,(performance.now()-t0-startAt)/(endAt-startAt)));
    progFill.style.width=(p*100)+'%';
    if(p<1) progRAF=requestAnimationFrame(tick);
  };
  progFill.style.width='0%'; progRAF=requestAnimationFrame(tick);
}
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.body.dataset.screen=id; updateGuide(id); }

/* idx can be a SONGS index or a whole song object (song builder). opts: {concert:true} */
function startSong(idx, opts={}){
  const song = typeof idx==='number' ? SONGS[idx] : idx;
  const custom = typeof idx!=='number', concert=!!opts.concert;
  const speedMul = (concert||custom) ? 1 : mastery(song);   // learn mode: songs start slow, concerts are full tilt
  const beatMs=(60000/song.bpm)/(tempoMul*speedMul);
  show('play'); cheer.classList.remove('show'); clearTimers(); audio();
  document.body.classList.toggle('concert',concert);
  lyricEl.textContent=song.title; bLetter.textContent=''; bubble.style.background='#E8E0D0';
  nextText.textContent=''; nextDiag.innerHTML=''; playDiag.innerHTML=''; turnTag.textContent='';
  buddyEl.innerHTML=critterSVG(buddyIdx());
  document.querySelector('#bubble .strum').textContent =
    PATTERNS[patternIdx].id==='hold' ? 'STRUM!' : PATTERNS[patternIdx].label;
  const crowdRow=document.getElementById('crowd-row');
  crowdRow.innerHTML = concert ? CAST.slice(0,LB.animals).map((c,i)=>critterSVG(i,44)).join('') : '';
  crowdRow.classList.toggle('rock',concert);
  playDiag.style.display = concert?'none':'';
  document.getElementById('next-chord').style.display = concert?'none':'';
  const duet = duetOn && !concert;
  const hitBox={hits:0, correct:0, total:song.events.length};
  const startAt=4*beatMs;   // count-in is four real beats, so the groove starts in time
  ['3','2','1','🎸'].forEach((n,i)=> timers.push(setTimeout(()=>{ countEl.textContent=n==='🎸'?'':n; }, i*beatMs)));
  if(backingOn) scheduleBacking(song, beatMs, startAt);
  if(concert) crowdCheer(audio().currentTime+Math.max(0,startAt/1000-0.5), 2.5);
  let t=0;
  song.events.forEach(([chord,beats,lyric],i)=>{
    const mine = duet ? Math.floor(t/4)%2===1 : true;   // duet: band demos the first 4 beats, then trade
    timers.push(setTimeout(()=>{
      bubble.style.background=CHORDS[chord].color; bLetter.textContent=chord;
      progFill.style.backgroundColor=CHORDS[chord].color;
      renderLyric(lyric, beats*beatMs);
      if(!concert){
        playDiag.innerHTML=chordSVG(chord);
        const nxt=song.events[i+1];
        nextText.textContent = nxt ? `next: ${nxt[0]}` : 'last one!';
        nextDiag.innerHTML = nxt && nxt[0]!==chord ? chordSVG(nxt[0]) : '';
      }
      if(duet) turnTag.innerHTML = mine ? '<span class="you">🫵 YOUR turn!</span>' : '<span class="band">🎺 band’s turn</span>';
      bubble.classList.remove('beat'); void bubble.offsetWidth; bubble.classList.add('beat');
      buddyEl.classList.remove('dance'); void buddyEl.offsetWidth; buddyEl.classList.add('dance');
      if(duet && !mine) playPattern(chord, beats, beatMs);  // band's half: app plays
      else if(micOn) listenForStrum(hitBox, chord);         // his guitar is the sound
      else if(!duet) playPattern(chord, beats, beatMs);     // duet kid-half without mic: he taps the bubble
    }, startAt + t*beatMs));
    t += beats;
  });
  runProgress(startAt, startAt + t*beatMs);
  if(concert) crowdCheer(audio().currentTime+(startAt+t*beatMs)/1000, 3);
  timers.push(setTimeout(()=>{
    // reward: star per finish (max 3 shown per song), animal every 3 total stars — builder jams stay just-for-fun
    let newAnimal=null;
    if(!custom){
      LB.done[song.title]=Math.min((LB.done[song.title]||0)+1, 99);
      newAnimal=awardStar();
      if(concert) LB.concerts++;
      saveLB(); renderSongs();
    }
    document.getElementById('cheer-msg').textContent =
      concert ? 'What a show! 🎪' : custom ? 'You wrote that one!' : `You played ${song.title}!`;
    const rep=document.getElementById('mic-report');
    rep.textContent = micOn
      ? (hitBox.hits ? `I heard you strum ${hitBox.hits} time${hitBox.hits===1?'':'s'}!` +
          (hitBox.correct ? ` ${hitBox.correct} sounded just right! 🎯` : '') : 'Strum louder next time — I was listening! 👂')
      : '';
    const na=document.getElementById('new-animal');
    na.classList.remove('show');
    if(newAnimal){ na.innerHTML=`${critterSVG(buddyIdx(),64)}<div>${newAnimal.name} joined the band!</div>
      <div class="joins">“${newAnimal.joins}”</div>`; na.classList.add('show'); }
    cheer.classList.add('show'); confetti(concert?64:newAnimal?40:22);
    const ac=audio(),tm=ac.currentTime;
    [392,493.88,587.33,783.99].forEach((f,i)=>pluck(f,tm+i*0.12,0.4));
  }, startAt + t*beatMs + 600));
}

/* ---------- switch trainer: changing chords is the whole skill ---------- */
const PAIRS=[['Em','C'],['G','C'],['G','D'],['C','D'],['Am','C'],['G','Em']];
const CHANGES=8;
let swPair=LB.swPair||0, swBeats=LB.swBeats||8, swRun=false, swBox=null, swArmed=null, swGain=null;
const pairRow=document.getElementById('pair-row'), swDiagram=document.getElementById('sw-diagram'),
      swLetter=document.getElementById('sw-letter'), swScore=document.getElementById('sw-score'),
      swLevelEl=document.getElementById('sw-level'), swGo=document.getElementById('sw-go'),
      swTarget=document.getElementById('sw-target');

function click(when, accent, dest){
  const ac=audio(), o=ac.createOscillator(), g=ac.createGain();
  o.type='square'; o.frequency.value=accent?1300:880;
  g.gain.setValueAtTime(0.0001,when);
  g.gain.exponentialRampToValueAtTime(accent?0.16:0.06,when+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,when+0.08);
  o.connect(g); g.connect(dest||swGain||ac.destination); o.start(when); o.stop(when+0.11);
}
function showTarget(name){
  swDiagram.innerHTML=chordSVG(name);
  swLetter.textContent=name; swLetter.style.color=CHORDS[name].color;
}
function swLevelText(){
  swLevelEl.textContent=`${swBeats} beat${swBeats===1?'':'s'} to change · best ${(LB.swBest||{})[swPair]||0}/${CHANGES}`;
}
function renderPairs(){
  pairRow.innerHTML='';
  PAIRS.forEach((p,i)=>{
    const b=document.createElement('button'); b.className='pair-chip'+(i===swPair?' on':'');
    b.textContent=`${p[0]} ⇄ ${p[1]}`;
    b.addEventListener('click',()=>{ if(swRun) return;
      swPair=i; LB.swPair=i; saveLB(); renderPairs(); showTarget(p[0]); swLevelText(); });
    pairRow.appendChild(b);
  });
}
renderPairs(); showTarget(PAIRS[swPair][0]); swLevelText();

/* TODO(you): how should the trainer get harder?
   Called after every run. `beats` is the current beats-per-change (8 is very slow,
   2 is a real-song pace), `score` is clean changes out of `total`.
   Trade-off: drop the beats fast and a kid who nailed one lucky run gets slammed
   with a tempo they can't hold; drop it slowly and they plateau, bored, at 8 beats.
   Also decide if a bad run should ever make it EASIER again — forgiving is kinder
   but means they can never really fail, which drains the reward. Your kid, your call. */
function nextLevel(beats, score, total){
  if(score>=total-1 && beats>2) return beats-2;   // nearly perfect → noticeably faster
  if(score<=total/2 && beats<8)  return beats+2;   // struggling → ease back off
  return beats;
}

function startSwitch(){
  if(swRun) return;
  const ac=audio(); swRun=true; swBox={hits:0,correct:0}; swArmed=null;
  swGain=ac.createGain(); swGain.connect(ac.destination);
  const pair=PAIRS[swPair], beatMs=600/tempoMul, beatS=beatMs/1000, lead=150, t0=ac.currentTime+lead/1000;
  swGo.textContent='🎵 …';
  swScore.textContent='Get ready…';
  const totalBeats=4+CHANGES*swBeats;
  for(let b=0;b<totalBeats;b++) click(t0+b*beatS, b<4 ? b===0 : (b-4)%swBeats===0);
  for(let c=0;c<CHANGES;c++){
    const chord=pair[c%2];
    timers.push(setTimeout(()=>{
      showTarget(chord);
      swScore.textContent=`Change ${c+1} of ${CHANGES}`;
      swTarget.classList.remove('beat'); void swTarget.offsetWidth; swTarget.classList.add('beat');
      if(micOn) listenForStrum(swBox, chord); else swArmed=chord;
    }, lead + (4+c*swBeats)*beatMs));
  }
  timers.push(setTimeout(finishSwitch, lead + totalBeats*beatMs + 400));
}
function finishSwitch(){
  swRun=false; swArmed=null; swGain?.disconnect(); swGain=null; swGo.textContent='🥁 Go!';
  const score = micOn ? swBox.correct : swBox.hits, before=swBeats;
  LB.swBest=LB.swBest||{}; LB.swBest[swPair]=Math.max(LB.swBest[swPair]||0, score);
  swBeats=nextLevel(swBeats, score, CHANGES); LB.swBeats=swBeats;
  let newMate=null;
  if(score>=CHANGES-2) newMate=awardStar();
  saveLB(); renderSongs(); swLevelText();
  swScore.textContent = score
    ? `${score} of ${CHANGES} clean changes!` +
      (swBeats<before?' Speeding up! 🔥' : swBeats>before?' Let us slow down a bit.' : '')
    : (micOn ? 'I did not hear much — strum louder next time! 👂' : 'Tap the card when the chord changes!');
  if(newMate) updateGuide('switch', `<b>${newMate.name}:</b> ${newMate.joins}`);
  if(score){ const ac=audio(),tm=ac.currentTime; [392,493.88,587.33].forEach((f,i)=>pluck(f,tm+i*0.1,0.35)); }
}
function stopSwitch(){
  if(!swRun) return;
  swRun=false; swArmed=null; swGain?.disconnect(); swGain=null; swGo.textContent='🥁 Go!';
}
swGo.addEventListener('click',startSwitch);
swTarget.addEventListener('pointerdown',()=>{
  const name=swLetter.textContent; if(!CHORDS[name]) return;
  if(!micOn) strum(name);
  if(swRun && swArmed===name){ swArmed=null; swBox.hits++; swBox.correct++;
    swTarget.classList.remove('good'); void swTarget.offsetWidth; swTarget.classList.add('good'); }
});

/* ---------- strumming patterns: steps are half-beat slots, D=down U=up, cycling ---------- */
const PATTERNS=[
  {id:'hold',  label:'—',        name:'One big strum — just strum when the chord changes', steps:null},
  {id:'down',  label:'↓',        name:'Steady — one down every beat',                      steps:['D',null]},
  {id:'bounce',label:'↓↑',       name:'Bouncy — down AND up, every beat',                  steps:['D','U']},
  {id:'folk',  label:'↓ ↓↑',     name:'Folk — down… then down-up',                         steps:['D',null,'D','U']},
  {id:'camp',  label:'↓ ↓↑ ↑↓↑', name:'Campfire — the famous one! Down, down-up, up-down-up', steps:['D',null,'D','U',null,'U','D','U']},
  {id:'ska',   label:'(↑)',      name:'Sneaky ups — ONLY the in-between ups!',             steps:[null,'U']},
];
let patternIdx=Math.min(LB.patternIdx||0, PATTERNS.length-1);
function playPattern(chord, beats, beatMs){
  const p=PATTERNS[patternIdx];
  if(!p.steps){ strum(chord); return; }
  const ac=audio(), t0=ac.currentTime, hS=beatMs/2000;
  for(let h=0;h<beats*2;h++){
    const step=p.steps[h%p.steps.length];
    if(step==='D') strum(chord, t0+h*hS);
    else if(step==='U') strumUp(chord, t0+h*hS);
  }
}

/* ---------- strum school: pick a pattern, watch it light up, copy it ---------- */
const patRow=document.getElementById('pat-row'), patDisplay=document.getElementById('pat-display'),
      patName=document.getElementById('pat-name'), patGo=document.getElementById('pat-go');
let patRun=false;
function renderPatterns(){
  patRow.innerHTML='';
  PATTERNS.forEach((p,i)=>{
    const b=document.createElement('button'); b.className='pair-chip'+(i===patternIdx?' on':'');
    b.textContent=p.label;
    b.addEventListener('click',()=>{ if(patRun) return;
      patternIdx=i; LB.patternIdx=i; saveLB(); renderPatterns(); });
    patRow.appendChild(b);
  });
  patName.textContent=PATTERNS[patternIdx].name;
  patDisplay.innerHTML = !PATTERNS[patternIdx].steps
    ? '<div class="pat-slot dn">↓</div>'
    : PATTERNS[patternIdx].steps.map(s=>
        `<div class="pat-slot ${s==='D'?'dn':s==='U'?'up':'rest'}">${s==='D'?'↓':s==='U'?'↑':'·'}</div>`).join('');
}
function startPat(){
  if(patRun){ stopPat(); return; }
  patRun=true; patGo.textContent='⏹ Stop'; audio();
  const p=PATTERNS[patternIdx], beatMs=820/tempoMul;   // ~73bpm — slow enough to copy
  const slots=[...patDisplay.children];
  const cycle=p.steps?p.steps.length:8;
  let h=0;
  const loop=()=>{
    if(!patRun) return;
    const idx=h%cycle;
    if(p.steps){
      slots.forEach((el,k)=>el.classList.toggle('lit',k===idx));
      const step=p.steps[idx];
      if(step==='D') strum(currentChord);
      else if(step==='U') strumUp(currentChord);
      if(idx%2===0) click(audio().currentTime, idx===0);
    }else{
      slots[0].classList.toggle('lit',idx===0);
      if(idx===0) strum(currentChord);
      if(idx%2===0) click(audio().currentTime, idx===0);
    }
    h++;
    timers.push(setTimeout(loop, beatMs/2));
  };
  loop();
}
function stopPat(){
  patRun=false; patGo.textContent='🥁 Try it!';
  [...patDisplay.children].forEach(el=>el.classList.remove('lit'));
}
patGo.addEventListener('click',startPat);
renderPatterns();

/* ---------- tuner: autocorrelation pitch detect on the mic ---------- */
const TUNE_STRINGS=[{n:'G',f:196.00},{n:'B',f:246.94},{n:'E',f:329.63}];
const tuneStringsEl=document.getElementById('tune-strings');
let tuneSmooth=0, tuneCooldownUntil=0;
TUNE_STRINGS.forEach((s,i)=>{
  const b=document.createElement('button'); b.className='pair-chip'; b.textContent=s.n;
  b.addEventListener('click',()=>{ tuneCooldownUntil=performance.now()+1600; pluck(s.f,undefined,0.5); });
  tuneStringsEl.appendChild(b);
});
function detectPitch(){
  if(!analyser) return 0;
  let rms=0; for(let i=0;i<micData.length;i++) rms+=micData[i]*micData[i];
  rms=Math.sqrt(rms/micData.length);
  if(rms<0.01) return 0;
  const sr=audio().sampleRate, minLag=Math.floor(sr/420), maxLag=Math.ceil(sr/140);
  let best=0,bestLag=0,e=0;
  for(let i=0;i<micData.length;i++) e+=micData[i]*micData[i];
  for(let lag=minLag;lag<=maxLag;lag++){
    let c=0;
    for(let i=0;i<micData.length-lag;i+=2) c+=micData[i]*micData[i+lag];
    if(c>best){best=c;bestLag=lag;}
  }
  if(best/(e/2)<0.3||!bestLag) return 0;   // not periodic enough — noise, not a string
  // parabolic refine: one-sample lag steps are ~13 cents at E4, too coarse for a tuner
  const corr=lag=>{ let c=0; for(let i=0;i<micData.length-lag;i+=2) c+=micData[i]*micData[i+lag]; return c; };
  const c0=corr(bestLag-1), c2=corr(bestLag+1), den=c0-2*best+c2;
  const shift=den ? 0.5*(c0-c2)/den : 0;
  return sr/(bestLag+Math.max(-1,Math.min(1,shift)));
}
function tunerTick(){
  const scr=document.getElementById('tuner');
  if(!scr.classList.contains('active')) return;
  if(performance.now()<tuneCooldownUntil) return;   // ignore our own reference note
  const p=detectPitch(); if(!p) return;
  let bi=0,bc=1e9;
  TUNE_STRINGS.forEach((s,i)=>{ const c=Math.abs(1200*Math.log2(p/s.f)); if(c<bc){bc=c;bi=i;} });
  if(bc>120) return;                                // way off any string — probably junk
  const cents=1200*Math.log2(p/TUNE_STRINGS[bi].f);
  tuneSmooth=tuneSmooth*0.6+cents*0.4;
  const deg=Math.max(-50,Math.min(50,tuneSmooth*1.2));
  document.getElementById('needle').style.transform=`translateX(-50%) rotate(${deg}deg)`;
  [...tuneStringsEl.children].forEach((el,i)=>el.classList.toggle('on',i===bi));
  const good=Math.abs(tuneSmooth)<8;
  scr.classList.toggle('good',good);
  document.getElementById('tune-msg').textContent = good
    ? `${TUNE_STRINGS[bi].n} — just right! ✨`
    : tuneSmooth<0 ? `${TUNE_STRINGS[bi].n} — too low, tighten a tiny bit 🔧`
                   : `${TUNE_STRINGS[bi].n} — too high, loosen a tiny bit 🔧`;
}

/* ---------- ear game: I strum, you tell me which chord ---------- */
let earOn=false, earTarget=null, earStreak=0;
const earBtn=document.getElementById('ear-btn');
function earRound(){
  const names=Object.keys(CHORDS);
  earTarget=names[Math.floor(Math.random()*names.length)];
  heardEl.className=''; heardEl.textContent='🙉 Listen… which chord was that?';
  strum(earTarget);
}
function nextEarRound(){
  if(earOn && document.getElementById('chords').classList.contains('active')) earRound();
}
function earAnswer(name,card){
  if(name===earTarget){
    earStreak++; LB.earBest=Math.max(LB.earBest,earStreak);
    heardEl.className='hit'; heardEl.textContent=`Yes, ${name}! 🎯 ${earStreak} in a row!`;
    card.classList.remove('playing'); void card.offsetWidth; card.classList.add('playing');
    if(earStreak%5===0){
      const nm=awardStar(); saveLB(); renderSongs();
      if(nm) updateGuide('chords', `<b>${nm.name}:</b> ${nm.joins}`);
    } else saveLB();
    earTarget=null; setTimeout(nextEarRound,1400);
  }else{
    heardEl.className='other'; heardEl.textContent=`It was ${earTarget} — listen again!`;
    earStreak=0; earTarget=null;
    setTimeout(nextEarRound,1600);
  }
}
earBtn.addEventListener('click',()=>{
  earOn=!earOn; earBtn.classList.toggle('on',earOn);
  document.getElementById('chords').classList.toggle('ear-on',earOn);
  if(earOn){ earStreak=0; audio(); earRound(); }
  else { earTarget=null; heardEl.textContent=''; heardEl.className=''; }
});

function renderStickers(){
  document.getElementById('sticker-grid').innerHTML=STICKERS.map(s=>
    `<div class="sticker ${s.ok()?'':'todo'}"><div class="ic">${s.ic}</div>
     <div class="nm">${s.nm}</div><div class="how">${s.how}</div></div>`).join('');
}
document.getElementById('star-total').addEventListener('click',()=>{ renderStickers(); show('stickers'); });
document.getElementById('stickers-back').addEventListener('click',()=>show('songs'));

/* ---------- duet toggle ---------- */
let duetOn=LB.duet===true;
const duetBtn=document.getElementById('duet-toggle');
duetBtn.classList.toggle('on',duetOn);
duetBtn.addEventListener('click',()=>{
  duetOn=!duetOn; duetBtn.classList.toggle('on',duetOn); LB.duet=duetOn; saveLB();
  updateGuide('songs', duetOn
    ? `<b>${currentBuddy().name}:</b> Duet time! The band plays 4 beats, then YOU play 4. We trade!`
    : `<b>${currentBuddy().name}:</b> Okay, back to playing all together!`);
});

/* ---------- song builder: pick 4 chords, we make it a song ---------- */
const SLOT_ORDER=['?','Em','C','G','Am','D'];
const slotEls=[...document.querySelectorAll('#builder .slot')];
const slotVals=['?','?','?','?'];
slotEls.forEach((el,i)=> el.addEventListener('click',()=>{
  slotVals[i]=SLOT_ORDER[(SLOT_ORDER.indexOf(slotVals[i])+1)%SLOT_ORDER.length];
  el.textContent=slotVals[i];
  el.classList.toggle('set',!!CHORDS[slotVals[i]]);
  el.style.background = CHORDS[slotVals[i]] ? CHORDS[slotVals[i]].color : '';
  if(CHORDS[slotVals[i]]) strum(slotVals[i]);
}));
document.getElementById('build-play').addEventListener('click',()=>{
  const picked=slotVals.filter(c=>CHORDS[c]);
  if(picked.length<2){
    updateGuide('jam', `<b>${currentBuddy().name}:</b> Tap the squares to pick at least two chords first!`);
    return;
  }
  LB.built++; saveLB();
  const events=[];
  for(let r=0;r<2;r++) picked.forEach(c=>events.push([c,4, r?'one more time!':'your song!']));
  startSong({title:'Your Jam', emoji:'🎛️', bpm:90, events});
});

/* ---------- record & playback: hear yourself, kept in memory only ---------- */
const recBtn=document.getElementById('rec-btn'), recPlay=document.getElementById('rec-play');
let recorder=null, recUrl=null;
if(!window.MediaRecorder) document.getElementById('rec-row').style.display='none';
recBtn.addEventListener('click',async()=>{
  if(recorder){ recorder.stop(); return; }
  try{
    const stream = micStream || await navigator.mediaDevices.getUserMedia({audio:true});
    const own = stream!==micStream;
    recorder=new MediaRecorder(stream);
    const chunks=[];
    recorder.ondataavailable=e=>chunks.push(e.data);
    recorder.onstop=()=>{
      if(recUrl) URL.revokeObjectURL(recUrl);
      recUrl=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));
      if(own) stream.getTracks().forEach(t=>t.stop());
      recorder=null;
      recBtn.textContent='🔴 Record me'; recBtn.classList.remove('rec');
      recPlay.disabled=false;
      LB.recorded++; saveLB();
      updateGuide('jam', `<b>${currentBuddy().name}:</b> Got it! Tap ▶ to hear yourself. You sound great.`);
    };
    recorder.start();
    recBtn.textContent='⏹ Stop'; recBtn.classList.add('rec');
  }catch{
    recBtn.textContent='🎤🚫'; setTimeout(()=>recBtn.textContent='🔴 Record me',1500);
  }
});
recPlay.addEventListener('click',()=>{ if(recUrl) new Audio(recUrl).play(); });

/* ---------- guide: your buddy talks to you on every screen ---------- */
const TIPS={
  chords:['Tap a colour to hear it. Press the strings just behind the metal bar!',
          'Em is the easy one — no fingers at all. Just strum!',
          'Turn on 🎤 Listen and play a chord on your real guitar. I will guess it!',
          'Curl your fingers like a spider so they miss the other strings.',
          'Push your thumb flat on the back of the neck. It helps a lot.'],
  songs:  ['Pick a song. I will hold up the chord you need — you do the strumming!',
           'Tap 🐢 if it goes too fast. Nobody is in a hurry here.',
           'Three stars and a new bandmate joins us. We are collecting friends.',
           'Row Your Boat is all one chord. Great for warming up your arm.'],
  switch: ['This is the secret one. Changing chords fast is the whole trick.',
           'Move all your fingers at the SAME time, not one by one.',
           'Look at the next shape before the beat gets there.',
           'Slow and clean beats fast and messy. Every time.'],
  jam:    ['No rules here. Mash the pads and make a racket.',
           'Try G, then C, then G, then D. That is a real song, secretly.',
           'Play along with your guitar — find the pad that matches your sound.',
           'Tap the squares up top to build your OWN song. Then press play!',
           'Press 🔴 and play something — then listen to yourself. Rock star.'],
  strum:  ['Pick a pattern and press Try it — then copy me on your guitar!',
           'Green arrows go DOWN, blue arrows go UP. Dots mean wait.',
           'The Campfire one is what real campfire songs use. Promise.',
           'Whatever pattern you pick here plays in the Songs tab too!'],
  tuner:  ['Play ONE string at a time, nice and slow. I will point at it.',
           'Tap a letter to hear what that string SHOULD sound like.',
           'Green means just right! If it is way off, ask a grown-up to help turn the peg.'],
  stickers:['Every sticker has a little mission. Grey ones are still waiting for you.',
            'The 🔥 ones are my favourite — play a little bit every day!',
            'Fill the whole page and you are officially a legend.'],
};
const guideEl=document.getElementById('guide'), guideFace=document.getElementById('guide-face'),
      guideSay=document.getElementById('guide-say');
let guideScreen='chords', guideIdx=0;
function updateGuide(id, line){
  if(id==='play'){ guideEl.classList.add('hide'); return; }
  guideEl.classList.remove('hide');
  const c=currentBuddy(), sleepy=petSleepy();
  guideFace.innerHTML=critterSVG(buddyIdx(),0,sleepy);
  guideEl.style.setProperty('--cc',c.dark);   // fur can be white (Bao) — dark always reads
  if(id!==guideScreen){ guideScreen=id; guideIdx=0; }
  const tips=TIPS[id]||TIPS.chords;
  guideSay.innerHTML=line||(sleepy&&guideIdx===0
    ? `<b>${c.name}:</b> *yawn* We have not played in a while… one song wakes me right up!`
    : `<b>${c.name}:</b> ${tips[guideIdx%tips.length]}`);
  guideEl.classList.remove('talk'); void guideEl.offsetWidth; guideEl.classList.add('talk');
}
guideEl.addEventListener('click',()=>{ guideIdx++; updateGuide(guideScreen); });

/* ---------- tabs ---------- */
const tabs={ 'tab-chords':'chords', 'tab-songs':'songs', 'tab-switch':'switch', 'tab-strum':'strum', 'tab-jam':'jam' };
Object.entries(tabs).forEach(([tid,sid])=>{
  document.getElementById(tid).addEventListener('click',()=>{
    clearTimers(); stopSwitch(); stopPat();
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
    document.getElementById(tid).classList.add('on'); show(sid);
  });
});
document.body.dataset.screen='chords';
updateGuide('chords');
</script>
