<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Loog Buddy</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Loog Buddy">
<meta name="theme-color" content="#FFF8EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<style>
  :root{
    --paper:#FFF8EC; --ink:#33302E; --soft:#8A8377;
    --em:#3EC98B; --c:#FFB528; --g:#4FA8F6; --coral:#FF6B5E;
    --card:#FFFFFF; --shadow:0 6px 0 rgba(51,48,46,.12);
    --display:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN",-apple-system,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;}
  html,body{height:100%;}
  body{margin:0; color:var(--ink); font-family:-apple-system,system-ui,sans-serif;
    background:var(--paper) radial-gradient(rgba(51,48,46,.045) 1.5px, transparent 1.5px);
    background-size:26px 26px;
    display:flex; flex-direction:column; overflow:hidden; touch-action:manipulation;}
  header{padding:calc(10px + env(safe-area-inset-top)) 20px 6px; display:flex; align-items:center; gap:10px;}
  header h1{font-family:var(--display); font-size:1.5rem; margin:0; letter-spacing:.5px;}
  header .dot{width:14px;height:14px;border-radius:50%; box-shadow:0 2px 0 rgba(51,48,46,.15);}
  main{flex:1; overflow:hidden; position:relative;}
  .screen{position:absolute; inset:0; display:none; flex-direction:column;
    padding:8px calc(16px + env(safe-area-inset-right)) 16px calc(16px + env(safe-area-inset-left));}
  .screen.active{display:flex;}

  /* ---------- tabs ---------- */
  nav{display:flex; gap:12px; padding:10px 16px calc(14px + env(safe-area-inset-bottom)); background:#fff;
    border-top:3px solid rgba(51,48,46,.08);}
  nav button{flex:1; font-family:var(--display); font-size:1rem; padding:14px 4px; border:none; border-radius:20px;
    background:var(--paper); color:var(--soft); cursor:pointer; transition:transform .08s; white-space:nowrap;}
  nav button:active{transform:scale(.95);}
  nav button.on{background:var(--ink); color:#fff; box-shadow:0 4px 0 rgba(51,48,46,.25);}
  nav button:focus-visible{outline:3px solid var(--g); outline-offset:2px;}

  /* ---------- chords screen ---------- */
  .chord-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:12px;}
  .chord-card{border:none; border-radius:24px; background:var(--card); box-shadow:var(--shadow);
    border-bottom:6px solid var(--cc, rgba(51,48,46,.12));
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer;
    padding:16px 8px; transition:transform .08s;}
  .chord-card:active{transform:scale(.96) translateY(2px);}
  .chord-card .big{font-family:var(--display); font-size:clamp(2.6rem,9vw,4.5rem); line-height:1;}
  .chord-card .hint{font-family:var(--display); font-size:.85rem; color:#fff; padding:5px 12px; border-radius:999px; white-space:nowrap;}
  .chord-card.playing{animation:wiggle .4s;}
  @keyframes wiggle{25%{transform:rotate(-2deg) scale(1.03);}75%{transform:rotate(2deg) scale(1.03);}}

  .diagram-wrap{flex:1; min-height:0; margin-top:14px; background:var(--card); border-radius:28px; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; gap:20px; padding:12px;}
  .diagram-wrap svg{height:100%; max-width:52%;}
  .diagram-side{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .diagram-side .name{font-family:var(--display); font-size:2.6rem;}
  .strum-btn{font-family:var(--display); font-size:1.5rem; color:#fff; background:var(--coral); border:none;
    border-radius:999px; padding:16px 34px; cursor:pointer; box-shadow:0 5px 0 #d94f44;}
  .strum-btn:active{transform:translateY(3px); box-shadow:0 2px 0 #d94f44;}

  /* ---------- songs screen ---------- */
  .song-list{flex:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px;
    align-content:start; overflow-y:auto; padding-bottom:8px;}
  .song-btn{border:none; border-radius:24px; background:var(--card); box-shadow:var(--shadow); padding:16px 20px;
    display:flex; align-items:center; gap:16px; cursor:pointer; text-align:left;}
  .song-btn:active{transform:scale(.98);}
  .song-btn .emoji{font-size:2rem; width:64px; height:64px; flex:0 0 64px; display:flex; align-items:center;
    justify-content:center; background:var(--paper); border-radius:20px;}
  .song-btn .t{font-family:var(--display); font-size:1.5rem;}
  .song-btn .s{color:var(--soft); font-size:.95rem; margin-top:2px;}

  /* ---------- play-along ---------- */
  #play{align-items:center; justify-content:center; gap:8px;}
  #play .lyric{font-family:var(--display); font-size:clamp(1.4rem,4.5vw,2.2rem); min-height:2.6rem; text-align:center; text-wrap:balance;}
  #bubble{width:min(46vw,300px); height:min(46vw,300px); border-radius:50%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; color:#fff; transition:background .2s; cursor:pointer;
    box-shadow:0 8px 0 rgba(51,48,46,.14), inset 0 -10px 0 rgba(0,0,0,.08);}
  #bubble .letter{font-family:var(--display); font-size:clamp(4rem,18vw,8rem); line-height:1;}
  #bubble .strum{font-family:var(--display); font-size:1.3rem; opacity:0; letter-spacing:2px;}
  #bubble.beat{animation:bounce .28s;}
  #bubble.beat .strum{opacity:1;}
  @keyframes bounce{40%{transform:scale(1.12);}}
  #next-chord{font-family:var(--display); font-size:1.15rem; color:var(--soft); min-height:1.5rem;
    display:flex; align-items:center; gap:8px;}
  #next-diagram{height:64px; opacity:.75;}
  #play-diagram{height:min(30vh,210px); background:var(--card); border-radius:20px;
    box-shadow:var(--shadow); padding:6px;}
  @media (max-width:420px){ #play-diagram{height:min(24vh,170px);} #buddy svg{width:56px;} }
  #count{font-family:var(--display); font-size:5rem; min-height:0;}
  .play-ctl{display:flex; gap:12px; margin-top:6px;}
  .play-ctl button{font-family:var(--display); font-size:1.2rem; border:none; border-radius:999px; padding:14px 28px; cursor:pointer;}
  #stop-btn{background:var(--paper); color:var(--ink); border:3px solid rgba(51,48,46,.15);}
  #cheer{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    background:var(--paper); z-index:5; gap:10px;}
  #cheer.show{display:flex;}
  #cheer .stars{font-size:4.5rem; animation:pop .5s;}
  #cheer h2{font-family:var(--display); font-size:2.4rem; margin:0;}
  @keyframes pop{0%{transform:scale(.3);}70%{transform:scale(1.2);}}
  /* ---------- chord match feedback ---------- */
  #mic-toggle-chords{font-family:var(--display); font-size:1.05rem;}
  #mic-toggle-chords.on{color:#fff;}
  #chord-heard{font-family:var(--display); font-size:1.3rem; min-height:3.2rem; text-align:center; text-wrap:balance;}
  #chord-heard.hit{color:var(--em); animation:pop .4s;}
  #chord-heard.other{color:var(--soft);}

  /* ---------- jam ---------- */
  #jam-grid{flex:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px;}
  .jam-pad{border:none; border-radius:28px; color:#fff; cursor:pointer; font-family:var(--display);
    font-size:clamp(3rem,10vw,5.5rem); transition:transform .06s;
    box-shadow:0 7px 0 rgba(51,48,46,.22), inset 0 -8px 0 rgba(0,0,0,.1);
    text-shadow:0 3px 0 rgba(0,0,0,.15);}
  .jam-pad:active{transform:scale(.94) translateY(4px); box-shadow:0 3px 0 rgba(51,48,46,.22), inset 0 -8px 0 rgba(0,0,0,.1);}
  .jam-pad.hit{animation:wiggle .35s;}

  /* ---------- toolbar: stars, tempo, mic ---------- */
  .songbar{display:flex; align-items:center; gap:10px; padding:4px 2px 12px; flex-wrap:wrap;}
  #star-total{font-family:var(--display); font-size:1.3rem; background:var(--card); border-radius:999px;
    padding:8px 16px; box-shadow:var(--shadow);}
  .toggle-group{display:flex; gap:6px; margin-left:auto;}
  .toggle{font-size:1.4rem; border:3px solid rgba(51,48,46,.12); background:var(--card); border-radius:16px;
    padding:8px 14px; cursor:pointer;}
  .toggle.on{border-color:var(--ink); background:var(--ink);}
  .song-btn .badge{margin-left:auto; font-size:1.3rem;}

  /* ---------- buddy + stage ---------- */
  #stage{display:flex; align-items:center; justify-content:center; gap:4vw;}
  #buddy svg{width:clamp(72px,17vw,120px); height:auto; display:block;}
  #buddy.dance{animation:hop .3s;}
  @keyframes hop{40%{transform:translateY(-18px) rotate(-8deg) scale(1.1);}}

  /* ---------- confetti + cheer extras ---------- */
  .confetti{position:absolute; top:-8%; z-index:6; font-size:1.9rem; animation:fall 1.6s ease-in forwards; pointer-events:none;}
  @keyframes fall{to{transform:translateY(115vh) rotate(340deg); opacity:.7;}}
  #mic-report{font-family:var(--display); font-size:1.4rem; color:var(--coral); min-height:1.5rem;}

  /* ---------- guide characters ---------- */
  #guide{display:flex; align-items:center; gap:10px; cursor:pointer;
    padding:4px calc(16px + env(safe-area-inset-right)) 6px calc(16px + env(safe-area-inset-left));}
  #guide.hide{display:none;}
  #guide .face{flex:0 0 auto; line-height:0;}
  #guide .face svg{width:52px; height:52px; display:block;}
  #guide.talk .face{animation:hop .4s;}
  #guide .say{position:relative; background:var(--card); border-radius:18px; box-shadow:var(--shadow);
    padding:10px 16px; font-family:var(--display); font-size:1rem; line-height:1.25; text-wrap:balance;}
  #guide .say::before{content:''; position:absolute; left:-8px; top:50%; margin-top:-7px;
    border:7px solid transparent; border-right-color:var(--card);}
  #guide .say b{color:var(--cc,var(--coral));}

  /* ---------- play: word highlight + progress ---------- */
  #play .lyric .w{opacity:.35; transition:opacity .15s, transform .15s; display:inline-block;}
  #play .lyric .w.lit{opacity:1; transform:scale(1.08);}
  #progress{width:min(80%,420px); height:14px; border-radius:999px; background:rgba(51,48,46,.1); overflow:hidden;}
  #progress i{display:block; height:100%; width:0; border-radius:999px; background:var(--em); transition:background .2s;}

  /* ---------- switch trainer ---------- */
  #switch{gap:10px; align-items:center;}
  .pair-row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .pair-chip{font-family:var(--display); font-size:1.1rem; border:3px solid rgba(51,48,46,.12); background:var(--card);
    border-radius:16px; padding:8px 14px; cursor:pointer; color:var(--soft);}
  .pair-chip.on{border-color:var(--ink); color:var(--ink); box-shadow:var(--shadow);}
  #sw-target{width:min(58vw,320px); border-radius:28px; background:var(--card); box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; gap:14px; padding:12px; cursor:pointer;}
  #sw-target svg{height:min(30vh,200px);}
  #sw-target .letter{font-family:var(--display); font-size:clamp(3rem,14vw,5.5rem); line-height:1;}
  #sw-target.beat{animation:bounce .28s;}
  #sw-target.good{animation:pop .35s;}
  #sw-score{font-family:var(--display); font-size:1.5rem; min-height:2rem; text-align:center; text-wrap:balance;}
  #sw-level{font-family:var(--display); font-size:1.05rem; color:var(--soft);}
  #new-animal{font-family:var(--display); font-size:1.4rem; display:none; text-align:center;}
  #new-animal.show{display:flex; flex-direction:column; align-items:center; gap:2px; animation:pop .5s;}
  #new-animal .joins{font-size:1rem; color:var(--soft); font-style:italic;}
  #band-shelf{display:flex; gap:2px; align-items:center; flex-wrap:wrap;}
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>

<header>
  <span class="dot" style="background:var(--em)"></span>
  <span class="dot" style="background:var(--c)"></span>
  <span class="dot" style="background:var(--g)"></span>
  <h1>Loog Buddy</h1>
</header>

<div id="guide" role="button" aria-label="ask your buddy for a tip">
  <span class="face" id="guide-face"></span><span class="say" id="guide-say"></span>
</div>

<main>
  <!-- CHORDS -->
  <section class="screen active" id="chords">
    <div class="chord-row" id="chord-row"></div>
    <div class="diagram-wrap">
      <svg id="fretboard" viewBox="0 0 220 300" aria-label="chord diagram"></svg>
      <div class="diagram-side">
        <div class="name" id="diag-name">Em</div>
        <button class="strum-btn" id="strum-again">🎸 Strum!</button>
        <button class="toggle" id="mic-toggle-chords" aria-label="listen to me">🎤 Listen</button>
        <div id="chord-heard"></div>
      </div>
    </div>
  </section>

  <!-- SONG LIST -->
  <section class="screen" id="songs">
    <div class="songbar">
      <span id="star-total">⭐️ 0</span>
      <span id="band-shelf"></span>
      <span class="toggle-group">
        <button class="toggle" id="tempo-slow" aria-label="slow">🐢</button>
        <button class="toggle" id="tempo-fast" aria-label="fast">🐇</button>
        <button class="toggle" id="backing-toggle" aria-label="backing band">🥁</button>
        <button class="toggle" id="mic-toggle" aria-label="listen to me">🎤</button>
      </span>
    </div>
    <div class="song-list" id="song-list"></div>
  </section>

  <!-- JAM -->
  <section class="screen" id="jam">
    <div id="jam-grid"></div>
  </section>

  <!-- SWITCH TRAINER -->
  <section class="screen" id="switch">
    <div class="pair-row" id="pair-row"></div>
    <div id="sw-target"><svg id="sw-diagram" viewBox="0 0 220 300" aria-hidden="true"></svg>
      <span class="letter" id="sw-letter">?</span></div>
    <div id="sw-score">Pick two chords, then go!</div>
    <div id="sw-level"></div>
    <div class="play-ctl"><button class="strum-btn" id="sw-go">🥁 Go!</button></div>
  </section>

  <!-- PLAY-ALONG -->
  <section class="screen" id="play">
    <div id="count"></div>
    <div class="lyric" id="lyric"></div>
    <div id="stage">
      <div id="buddy">🐵</div>
      <div id="bubble"><span class="letter" id="bubble-letter"></span><span class="strum">STRUM!</span></div>
      <svg id="play-diagram" viewBox="0 0 220 300" aria-hidden="true"></svg>
    </div>
    <div id="next-chord"><svg id="next-diagram" viewBox="0 0 220 300" aria-hidden="true"></svg><span id="next-text"></span></div>
    <div id="progress"><i id="progress-fill"></i></div>
    <div class="play-ctl"><button id="stop-btn">⏹ Stop</button></div>
    <div id="cheer"><div class="stars">⭐️⭐️⭐️</div><h2 id="cheer-msg">You did it!</h2>
      <div id="mic-report"></div><div id="new-animal"></div>
      <button class="strum-btn" id="cheer-done">Yay!</button></div>
  </section>
</main>

<nav>
  <button id="tab-chords" class="on">🎨 Chords</button>
  <button id="tab-songs">🎵 Songs</button>
  <button id="tab-switch">🔁 Switch</button>
  <button id="tab-jam">🤘 Jam</button>
</nav>

<script>
/* ---------- Loog chord data: strings low→high G3 B3 E4, frets ---------- */
const CHORDS = {
  Em:{frets:[0,0,0], fingers:[0,0,0], color:'#3EC98B', hint:'no fingers!'},
  C: {frets:[0,1,0], fingers:[0,1,0], color:'#FFB528', hint:'1 finger'},
  G: {frets:[0,0,3], fingers:[0,0,3], color:'#4FA8F6', hint:'1 finger'},
  Am:{frets:[2,1,0], fingers:[2,1,0], color:'#F1568C', hint:'2 fingers'},
  D: {frets:[2,3,2], fingers:[1,3,2], color:'#9B6DE0', hint:'3 fingers — super chord!'},
};
const OPEN_FREQ = [196.00, 246.94, 329.63]; // G3 B3 E4

/* ---------- audio: plucked-string synth ---------- */
let ctx;
function audio(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); return ctx; }
function pluck(freq, when, vol=0.5){
  const ac=audio(), o=ac.createOscillator(), o2=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
  o.type='triangle'; o.frequency.value=freq;
  o2.type='sine'; o2.frequency.value=freq*2; // a little shimmer
  f.type='lowpass'; f.frequency.setValueAtTime(freq*6,when); f.frequency.exponentialRampToValueAtTime(freq*1.5,when+1.2);
  g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(vol,when+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,when+1.6);
  o.connect(f); o2.connect(f); f.connect(g); g.connect(ac.destination);
  o.start(when); o2.start(when); o.stop(when+1.7); o2.stop(when+1.7);
}
function strum(name, when){
  const ac=audio(); when = when ?? ac.currentTime;
  try{ matchCooldownUntil=performance.now()+1800; }catch{}  // don't let the matcher hear the app itself
  CHORDS[name].frets.forEach((fr,i)=> pluck(OPEN_FREQ[i]*Math.pow(2,fr/12), when + i*0.06, 0.42));
}

/* ---------- backing band: drums + bass, synthesised so it works offline ---------- */
const ROOTS={Em:82.41, C:130.81, G:98.00, Am:110.00, D:146.83};   // one octave under the guitar
let songGain=null, noiseBuf=null;
function noise(){
  if(!noiseBuf){ const ac=audio(), n=Math.floor(ac.sampleRate*0.5);
    noiseBuf=ac.createBuffer(1,n,ac.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; }
  return noiseBuf;
}
function kick(when,dest){
  const ac=audio(), o=ac.createOscillator(), g=ac.createGain();
  o.frequency.setValueAtTime(140,when); o.frequency.exponentialRampToValueAtTime(45,when+0.12);
  g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(0.55,when+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,when+0.3);
  o.connect(g); g.connect(dest); o.start(when); o.stop(when+0.32);
}
function snare(when,dest){
  const ac=audio(), s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noise(); f.type='bandpass'; f.frequency.value=1900; f.Q.value=0.7;
  g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(0.2,when+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,when+0.17);
  s.connect(f); f.connect(g); g.connect(dest); s.start(when); s.stop(when+0.2);
}
function hat(when,dest,vol){
  const ac=audio(), s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noise(); f.type='highpass'; f.frequency.value=7000;
  g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(vol,when+0.003);
  g.gain.exponentialRampToValueAtTime(0.0001,when+0.05);
  s.connect(f); f.connect(g); g.connect(dest); s.start(when); s.stop(when+0.07);
}
function bass(freq,when,dur,dest){
  const ac=audio(), o=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain();
  o.type='triangle'; o.frequency.value=freq;
  f.type='lowpass'; f.frequency.value=freq*4;
  g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(0.3,when+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  o.connect(f); f.connect(g); g.connect(dest); o.start(when); o.stop(when+dur+0.05);
}
function stopBacking(){ if(songGain){ try{ songGain.disconnect(); }catch{} songGain=null; } }

/* lay the whole groove down on the audio clock — steadier than setTimeout ever gets */
function scheduleBacking(song, beatMs, leadMs){
  const ac=audio(); stopBacking();
  songGain=ac.createGain(); songGain.gain.value=0.85; songGain.connect(ac.destination);
  const dest=songGain, beatS=beatMs/1000, t0=ac.currentTime+leadMs/1000;
  for(let b=-4;b<0;b++) click(t0+b*beatS, b===-4, dest);   // tempo-locked count-in
  const line=[];
  song.events.forEach(([c,beats])=>{ for(let k=0;k<beats;k++) line.push(c); });
  line.forEach((chord,i)=>{
    const at=t0+i*beatS;
    if(i%4===0||i%4===2) kick(at,dest);
    if(i%4===1||i%4===3) snare(at,dest);
    hat(at,dest,0.07); hat(at+beatS/2,dest,0.04);
    // pitched bass biases the chord guesser, so drums only while the mic is scoring
    if(!micOn && i%2===0) bass(ROOTS[chord], at, beatS*0.9, dest);
  });
}

/* ---------- fretboard diagram ---------- */
function chordSVG(name){
  const {frets,fingers,color}=CHORDS[name];
  const L=40,R=180,T=40,B=270,rows=4,cols=3, sw=(R-L)/(cols-1), rh=(B-T)/rows;
  let s=`<rect x="${L-14}" y="${T-6}" width="${R-L+28}" height="${B-T+12}" rx="14" fill="#F6EEDD"/>`;
  s+=`<rect x="${L-10}" y="${T-8}" width="${R-L+20}" height="10" rx="4" fill="#33302E"/>`;
  for(let r=1;r<=rows;r++) s+=`<line x1="${L-10}" y1="${T+r*rh}" x2="${R+10}" y2="${T+r*rh}" stroke="#CBBFA6" stroke-width="3"/>`;

/* ---------- mic strum listener (amplitude spikes, deliberately generous) ---------- */
const micBtn=document.getElementById('mic-toggle'), micBtnChords=document.getElementById('mic-toggle-chords');
let micOn=false, micStream=null, analyser=null, micData=null, freqData=null, micLevel=0, micBase=0.006, micLoop=0;
function micButtonsSync(){
  micBtn.classList.toggle('on',micOn);
  micBtnChords.classList.toggle('on',micOn);
  micBtnChords.style.background=micOn?'var(--coral)':'';
  if(!micOn) heardEl.textContent='';

async function toggleMic(failBtn){
  if(micOn){ micOn=false; stopMic(); micButtonsSync(); return; }
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ac=audio(), src=ac.createMediaStreamSource(micStream);
    analyser=ac.createAnalyser(); analyser.fftSize=4096; analyser.smoothingTimeConstant=0.4; src.connect(analyser);
    micData=new Float32Array(analyser.fftSize);
    freqData=new Float32Array(analyser.frequencyBinCount);
    micOn=true; trackMic();
  }catch{ const t=failBtn.textContent; failBtn.textContent='🎤🚫'; setTimeout(()=>failBtn.textContent=t,1500); }
  micButtonsSync();
}
micBtn.addEventListener('click',()=>toggleMic(micBtn));
micBtnChords.addEventListener('click',()=>toggleMic(micBtnChords));
function trackMic(){
  if(!micOn||!analyser) return;
  analyser.getFloatTimeDomainData(micData);
  let sum=0; for(let i=0;i<micData.length;i++) sum+=micData[i]*micData[i];
  micLevel=Math.sqrt(sum/micData.length);
  micBase=micBase*0.995+micLevel*0.005;   // slow-moving room noise floor
  chordMatchTick();
  micLoop=requestAnimationFrame(trackMic);
}

/* ---------- chord match game on the Chords tab ---------- */
const heardEl=document.getElementById('chord-heard');
let matchCooldownUntil=0;
function chordMatchTick(){
  if(!document.getElementById('chords').classList.contains('active')) return;
  const now=performance.now();
  if(now<matchCooldownUntil) return;
  if(micLevel>Math.max(0.025, micBase*3)){
    matchCooldownUntil=now+1400;          // one guess per strum
    setTimeout(()=>{                       // let the chord ring before guessing
      if(!micOn) return;
      const heard=guessChord();
      if(heard===currentChord){
        heardEl.className='hit'; heardEl.textContent=`That's ${currentChord}! 🎯⭐️`;
        matchCooldownUntil=performance.now()+2600;   // reward jingle shouldn't retrigger the matcher
        const ac=audio(),tm=ac.currentTime; [523.25,659.25,783.99].forEach((f,i)=>pluck(f,tm+i*0.09,0.3));
      }else{
        heardEl.className='other'; heardEl.textContent=`I heard something like ${heard} — try again!`;
      }
    },200);
  }
}
function stopMic(){ cancelAnimationFrame(micLoop); micStream?.getTracks().forEach(t=>t.stop()); micStream=null; analyser=null; }

/* chord guesser: which of the 5 chords does the spectrum look most like?
   Scores energy at each chord's note fundamentals + 2 harmonics. Best-effort and
   deliberately generous — used only to praise, never to say "wrong". */
function guessChord(){
  if(!analyser) return null;
  analyser.getFloatFrequencyData(freqData);
  const binHz=audio().sampleRate/analyser.fftSize;
  const energyAt=f=>{
    const b=Math.round(f/binHz); let m=-160;
    for(let i=Math.max(0,b-1);i<=b+1;i++) m=Math.max(m,freqData[i]??-160);
    return m+140; // shift so silence ~ -20dB → 0-ish floor
  };
  let best=null,bestScore=-1;
  for(const [name,ch] of Object.entries(CHORDS)){
    let s=0;
    ch.frets.forEach((fr,i)=>{
      const f=OPEN_FREQ[i]*Math.pow(2,fr/12);
      s+=energyAt(f)+0.5*energyAt(f*2)+0.25*energyAt(f*3);
    });
    if(s>bestScore){ bestScore=s; best=name; }
  }
  return best;
}

/* watch a window after a cue: did the room get loud, and did it sound like the chord? */
function listenForStrum(hitBox, expected){
  if(!micOn) return;
  const start=performance.now(), base=micLevel;
  const check=()=>{
    if(performance.now()-start>1100) return;
    if(micLevel>Math.max(0.02, base*2.2)){
      hitBox.hits++;
      setTimeout(()=>{ if(guessChord()===expected) hitBox.correct++; },120); // let the strum ring
      return;
    }
    requestAnimationFrame(check);
  };
  requestAnimationFrame(check);
}

function renderLyric(text, durMs){
  const words=text.split(/\s+/).filter(Boolean);
  lyricEl.innerHTML=words.map(w=>`<span class="w">${w}</span>`).join(' ');
  const spans=[...lyricEl.querySelectorAll('.w')], step=durMs/words.length;

const progFill=document.getElementById('progress-fill');
function runProgress(startAt, endAt){
  const t0=performance.now();
  const tick=()=>{
    const p=Math.max(0,Math.min(1,(performance.now()-t0-startAt)/(endAt-startAt)));
    progFill.style.width=(p*100)+'%';
    if(p<1) progRAF=requestAnimationFrame(tick);
  };
  progFill.style.width='0%'; progRAF=requestAnimationFrame(tick);
}

  if(backingOn) scheduleBacking(song, beatMs, startAt);

    timers.push(setTimeout(()=>{
      bubble.style.background=CHORDS[chord].color; bLetter.textContent=chord;

  }, startAt + t*beatMs + 600));

const jamGrid=document.getElementById('jam-grid');
Object.entries(CHORDS).forEach(([name,ch])=>{
  const p=document.createElement('button'); p.className='jam-pad'; p.style.background=ch.color; p.textContent=name;
  const hit=()=>{ strum(name); p.classList.remove('hit'); void p.offsetWidth; p.classList.add('hit'); };
  p.addEventListener('pointerdown',hit);
  jamGrid.appendChild(p);
});

/* ---------- tap the bubble to strum along ---------- */
bubble.addEventListener('pointerdown',()=>{
  const c=bLetter.textContent; if(!CHORDS[c]) return;
  if(!micOn) strum(c);
  bubble.classList.remove('beat'); void bubble.offsetWidth; bubble.classList.add('beat');
});

/* ---------- keep the screen awake while playing ---------- */
let wakeLock=null;
async function keepAwake(){ try{ wakeLock=await navigator.wakeLock?.request('screen'); }catch{} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') keepAwake(); });
document.addEventListener('pointerdown',()=>{ if(!wakeLock) keepAwake(); },{once:true});

/* ---------- remember tempo between sessions ---------- */
if(LB.tempo===0.72){ tempoMul=0.72; slowBtn.classList.add('on'); }
if(LB.tempo===1.3){ tempoMul=1.3; fastBtn.classList.add('on'); }
const saveTempo=()=>{ LB.tempo=tempoMul; saveLB(); };
slowBtn.addEventListener('click',saveTempo); fastBtn.addEventListener('click',saveTempo);

/* ---------- switch trainer: changing chords is the whole skill ---------- */
const PAIRS=[['Em','C'],['G','C'],['G','D'],['C','D'],['Am','C'],['G','Em']];
const CHANGES=8;
let swPair=LB.swPair||0, swBeats=LB.swBeats||8, swRun=false, swBox=null, swArmed=null, swGain=null;
const pairRow=document.getElementById('pair-row'), swDiagram=document.getElementById('sw-diagram'),
      swLetter=document.getElementById('sw-letter'), swScore=document.getElementById('sw-score'),
      swLevelEl=document.getElementById('sw-level'), swGo=document.getElementById('sw-go'),
      swTarget=document.getElementById('sw-target');

function click(when, accent, dest){
  const ac=audio(), o=ac.createOscillator(), g=ac.createGain();
  o.type='square'; o.frequency.value=accent?1300:880;
  g.gain.setValueAtTime(0.0001,when);
  g.gain.exponentialRampToValueAtTime(accent?0.16:0.06,when+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,when+0.08);
  o.connect(g); g.connect(dest||swGain||ac.destination); o.start(when); o.stop(when+0.11);
}
function showTarget(name){
  swDiagram.innerHTML=chordSVG(name);
  swLetter.textContent=name; swLetter.style.color=CHORDS[name].color;
}
function swLevelText(){
  swLevelEl.textContent=`${swBeats} beat${swBeats===1?'':'s'} to change · best ${(LB.swBest||{})[swPair]||0}/${CHANGES}`;
}
function renderPairs(){
  pairRow.innerHTML='';
  PAIRS.forEach((p,i)=>{
    const b=document.createElement('button'); b.className='pair-chip'+(i===swPair?' on':'');
    b.textContent=`${p[0]} ⇄ ${p[1]}`;
    b.addEventListener('click',()=>{ if(swRun) return;
      swPair=i; LB.swPair=i; saveLB(); renderPairs(); showTarget(p[0]); swLevelText(); });
    pairRow.appendChild(b);
  });
}
renderPairs(); showTarget(PAIRS[swPair][0]); swLevelText();

/* TODO(you): how should the trainer get harder?
   Called after every run. `beats` is the current beats-per-change (8 is very slow,
   2 is a real-song pace), `score` is clean changes out of `total`.
   Trade-off: drop the beats fast and a kid who nailed one lucky run gets slammed
   with a tempo they can't hold; drop it slowly and they plateau, bored, at 8 beats.
   Also decide if a bad run should ever make it EASIER again — forgiving is kinder
   but means they can never really fail, which drains the reward. Your kid, your call. */
function nextLevel(beats, score, total){
  if(score>=total-1 && beats>2) return beats-2;   // nearly perfect → noticeably faster
  if(score<=total/2 && beats<8)  return beats+2;   // struggling → ease back off
  return beats;
}

function startSwitch(){
  if(swRun) return;
  const ac=audio(); swRun=true; swBox={hits:0,correct:0}; swArmed=null;
  swGain=ac.createGain(); swGain.connect(ac.destination);
  const pair=PAIRS[swPair], beatMs=600/tempoMul, beatS=beatMs/1000, lead=150, t0=ac.currentTime+lead/1000;
  swGo.textContent='🎵 …';
  swScore.textContent='Get ready…';
  const totalBeats=4+CHANGES*swBeats;
  for(let b=0;b<totalBeats;b++) click(t0+b*beatS, b<4 ? b===0 : (b-4)%swBeats===0);
  for(let c=0;c<CHANGES;c++){
    const chord=pair[c%2];
    timers.push(setTimeout(()=>{
      showTarget(chord);
      swScore.textContent=`Change ${c+1} of ${CHANGES}`;
      swTarget.classList.remove('beat'); void swTarget.offsetWidth; swTarget.classList.add('beat');
      if(micOn) listenForStrum(swBox, chord); else swArmed=chord;
    }, lead + (4+c*swBeats)*beatMs));
  }
  timers.push(setTimeout(finishSwitch, lead + totalBeats*beatMs + 400));
}
function finishSwitch(){
  swRun=false; swArmed=null; swGain?.disconnect(); swGain=null; swGo.textContent='🥁 Go!';
  const score = micOn ? swBox.correct : swBox.hits, before=swBeats;
  LB.swBest=LB.swBest||{}; LB.swBest[swPair]=Math.max(LB.swBest[swPair]||0, score);
  swBeats=nextLevel(swBeats, score, CHANGES); LB.swBeats=swBeats;
  let newMate=null;
  if(score>=CHANGES-2) newMate=awardStar();
  saveLB(); renderSongs(); swLevelText();
  swScore.textContent = score
    ? `${score} of ${CHANGES} clean changes!` +
      (swBeats<before?' Speeding up! 🔥' : swBeats>before?' Let us slow down a bit.' : '')
    : (micOn ? 'I did not hear much — strum louder next time! 👂' : 'Tap the card when the chord changes!');
  if(newMate) updateGuide('switch', `<b>${newMate.name}:</b> ${newMate.joins}`);
  if(score){ const ac=audio(),tm=ac.currentTime; [392,493.88,587.33].forEach((f,i)=>pluck(f,tm+i*0.1,0.35)); }
}
function stopSwitch(){
  if(!swRun) return;
  swRun=false; swArmed=null; swGain?.disconnect(); swGain=null; swGo.textContent='🥁 Go!';
}
swGo.addEventListener('click',startSwitch);
swTarget.addEventListener('pointerdown',()=>{
  const name=swLetter.textContent; if(!CHORDS[name]) return;
  if(!micOn) strum(name);
  if(swRun && swArmed===name){ swArmed=null; swBox.hits++; swBox.correct++;
    swTarget.classList.remove('good'); void swTarget.offsetWidth; swTarget.classList.add('good'); }
});

/* ---------- guide: your buddy talks to you on every screen ---------- */
const TIPS={
  chords:['Tap a colour to hear it. Press the strings just behind the metal bar!',
          'Em is the easy one — no fingers at all. Just strum!',
          'Turn on 🎤 Listen and play a chord on your real guitar. I will guess it!',
          'Curl your fingers like a spider so they miss the other strings.',
          'Push your thumb flat on the back of the neck. It helps a lot.'],
  songs:  ['Pick a song. I will hold up the chord you need — you do the strumming!',
           'Tap 🐢 if it goes too fast. Nobody is in a hurry here.',
           'Three stars and a new bandmate joins us. We are collecting friends.',
           'Row Your Boat is all one chord. Great for warming up your arm.'],
  switch: ['This is the secret one. Changing chords fast is the whole trick.',
           'Move all your fingers at the SAME time, not one by one.',
           'Look at the next shape before the beat gets there.',
           'Slow and clean beats fast and messy. Every time.'],
  jam:    ['No rules here. Mash the pads and make a racket.',
           'Try G, then C, then G, then D. That is a real song, secretly.',
           'Play along with your guitar — find the pad that matches your sound.'],
};
const guideEl=document.getElementById('guide'), guideFace=document.getElementById('guide-face'),
      guideSay=document.getElementById('guide-say');
let guideScreen='chords', guideIdx=0;
function updateGuide(id, line){
  if(id==='play'){ guideEl.classList.add('hide'); return; }
  guideEl.classList.remove('hide');
  const c=currentBuddy();
  guideFace.innerHTML=critterSVG(buddyIdx());
  guideEl.style.setProperty('--cc',c.dark);   // fur can be white (Bao) — dark always reads
  if(id!==guideScreen){ guideScreen=id; guideIdx=0; }
  const tips=TIPS[id]||TIPS.chords;
  guideSay.innerHTML=line||`<b>${c.name}:</b> ${tips[guideIdx%tips.length]}`;
  guideEl.classList.remove('talk'); void guideEl.offsetWidth; guideEl.classList.add('talk');
}
guideEl.addEventListener('click',()=>{ guideIdx++; updateGuide(guideScreen); });

/* ---------- tabs ---------- */
const tabs={ 'tab-chords':'chords', 'tab-songs':'songs', 'tab-switch':'switch', 'tab-jam':'jam' };
Object.entries(tabs).forEach(([tid,sid])=>{
  document.getElementById(tid).addEventListener('click',()=>{
    clearTimers(); stopSwitch();
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
    document.getElementById(tid).classList.add('on'); show(sid);
  });
});
updateGuide('chords');
</script>

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
